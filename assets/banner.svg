<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0a0f1d;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0c172f"/><stop offset="100%" stop-color="#050a14"/></linearGradient><linearGradient id="primaryTextGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="streamGrad1" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".1"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".1"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseBeam{0%{stroke-dashoffset:800;opacity:.3}50%{opacity:.9}}@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-15px) scale(1.3);opacity:.9}}@keyframes cardBob{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.flow-line{stroke-dasharray:60 180;animation:pulseBeam 5s linear infinite}.flow-line-reverse{stroke-dasharray:80 160;animation:pulseBeam 4s linear infinite reverse}.particle{animation:floatParticle 4s ease-in-out infinite}.card-anim{animation:cardBob 6s ease-in-out infinite}.card-anim-delayed{animation:cardBob 6s ease-in-out infinite 3s}</style><rect width="1200" height="360" fill="url