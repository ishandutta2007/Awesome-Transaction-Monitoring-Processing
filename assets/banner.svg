<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0c172f" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing and streaming animations in background */
    @keyframes pulseBeam {
      0% { stroke-dashoffset: 800; opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-15px) scale(1.3); opacity: 0.9; }
      100% { transform: translateY(0px) scale(1); opacity: 0.4; }
    }
    @keyframes cardBob {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    .flow-line {
      stroke-dasharray: 60 180;
      animation: pulseBeam 5s linear infinite;
    }
    .flow-line-reverse {
      stroke-dasharray: 80 160;
      animation: pulseBeam 4s linear infinite reverse;
    }
    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }
    .card-anim {
      animation: cardBob 6s ease-in-out infinite;
    }
    .card-anim-delayed {
      animation: cardBob 6s ease-in-out infinite 3s;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Technical Grid Overlay (Background) -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Transaction Stream Waves (Background - Behind foreground content) -->
  <path d="M -50 90 Q 250 140 550 80 T 1250 110" fill="none" stroke="url(#streamGrad1)" stroke-width="3" class="flow-line" />
  <path d="M -50 290 Q 300 240 650 280 T 1250 260" fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="2.5" class="flow-line-reverse" />
  <path d="M 50 40 Q 400 10 700 70 T 1250 30" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="1.5" class="flow-line" />

  <!-- Ambient glowing nodes (Behind text) -->
  <circle cx="220" cy="90" r="4" fill="#38bdf8" filter="url(#glow)" class="particle" />
  <circle cx="980" cy="110" r="5" fill="#a855f7" filter="url(#glow)" class="particle" style="animation-delay: 1.5s;" />
  <circle cx="820" cy="270" r="4" fill="#10b981" filter="url(#glow)" class="particle" style="animation-delay: 2.2s;" />
  <circle cx="340" cy="290" r="4" fill="#6366f1" filter="url(#glow)" class="particle" style="animation-delay: 0.8s;" />

  <!-- FOREGROUND: Main Title and Core Headings (High Contrast, Clear Layering) -->
  <g id="foreground-content">
    <!-- Top Super-Badge -->
    <rect x="440" y="38" width="320" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="456" cy="52" r="5" fill="#10b981" />
    <text x="472" y="58" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1.2">CURATED FINTECH &amp; REGTECH DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="118" text-anchor="middle" font-size="36" font-weight="800" fill="url(#primaryTextGrad)" letter-spacing="-0.5">
      Awesome Transaction Monitoring &amp; Processing
    </text>

    <!-- Subtitle -->
    <text x="600" y="154" text-anchor="middle" font-size="15" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Real-Time Fraud Prevention • AML Surveillance • Sanctions Screening • Payment Orchestration
    </text>

    <!-- Pill Attributes / Dynamic Metrics Banner (Foreground Anchors) -->
    <g transform="translate(180, 185)">
      <!-- Pill 1: Fraud ML -->
      <g class="card-anim">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="20" y="26" font-size="18">🛡️</text>
        <text x="50" y="21" fill="#f8fafc" font-size="12" font-weight="700">Fraud Detection</text>
        <text x="50" y="34" fill="#94a3b8" font-size="10">Real-Time Risk &amp; ML</text>
      </g>

      <!-- Pill 2: AML / FRAML -->
      <g transform="translate(210, 0)" class="card-anim-delayed">
        <rect x="0" y="0" width="190" height="42" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="20" y="26" font-size="18">⚖️</text>
        <text x="52" y="21" fill="#f8fafc" font-size="12" font-weight="700">AML &amp; Compliance</text>
        <text x="52" y="34" fill="#94a3b8" font-size="10">Sanctions, PEP &amp; SARs</text>
      </g>

      <!-- Pill 3: Payment Orchestration -->
      <g transform="translate(430, 0)" class="card-anim">
        <rect x="0" y="0" width="200" height="42" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="20" y="26" font-size="18">⚡</text>
        <text x="52" y="21" fill="#f8fafc" font-size="12" font-weight="700">Payment Routing</text>
        <text x="52" y="34" fill="#94a3b8" font-size="10">Multi-PSP Orchestration</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(660, 0)" class="card-anim-delayed">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="20" y="26" font-size="18">🔓</text>
        <text x="50" y="21" fill="#f8fafc" font-size="12" font-weight="700">Open-Source Engines</text>
        <text x="50" y="34" fill="#94a3b8" font-size="10">Auditable &amp; Self-Hosted</text>
      </g>
    </g>

    <!-- Bottom Stat Bar (Foreground) -->
    <g transform="translate(250, 260)">
      <rect x="0" y="0" width="700" height="48" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
      <text x="35" y="30" fill="#38bdf8" font-size="14" font-weight="700">9 Enterprise SaaS</text>
      <text x="155" y="30" fill="#475569" font-size="14">•</text>
      <text x="180" y="30" fill="#a78bfa" font-size="14" font-weight="700">10 Open-Source Engines</text>
      <text x="360" y="30" fill="#475569" font-size="14">•</text>
      <text x="385" y="30" fill="#34d399" font-size="14" font-weight="700">Detailed Pricing &amp; Limits</text>
      <text x="575" y="30" fill="#475569" font-size="14">•</text>
      <text x="600" y="30" fill="#f59e0b" font-size="14" font-weight="700">Market Dynamics</text>
    </g>

    <!-- Version & Community Tag -->
    <text x="600" y="335" text-anchor="middle" fill="#64748b" font-size="11" font-weight="500">
      🚀 Maintained by the open-source fintech community • Constantly updated with benchmarks &amp; star metrics
    </text>
  </g>
</svg>